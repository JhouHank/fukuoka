<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>2026 福岡周家旅遊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: oklch(97% 0.005 70);
        --paper-deep: oklch(94% 0.008 70);
        --paper-soft: oklch(91% 0.008 70);
        --paper-edge: oklch(86% 0.008 70);
        --ink: oklch(28% 0.01 70);
        --ink-soft: oklch(48% 0.008 70);
        --ink-faint: oklch(65% 0.008 70);
        --ink-ghost: oklch(78% 0.008 70);
        --vermilion: oklch(55% 0.13 28);
        --vermilion-deep: oklch(45% 0.13 28);
        --vermilion-tint: oklch(94% 0.025 28);
        --overlay: oklch(15% 0.01 70 / 0.55);

        --radius-sm: 4px;
        --radius-md: 10px;
        --radius-lg: 20px;
        --radius-pill: 999px;

        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 12px;
        --space-base: 16px;
        --space-lg: 20px;
        --space-xl: 24px;

        --font-sans:
          -apple-system, BlinkMacSystemFont, 'Noto Sans TC', system-ui,
          'Helvetica Neue', Arial, sans-serif;
        --font-serif:
          'Noto Serif TC', 'Source Han Serif TC', Georgia, 'Times New Roman',
          serif;

        --duration-fast: 0.15s;
        --duration-base: 0.3s;
        --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.5;
        color: var(--ink);
        background: var(--paper);
        overflow: hidden;
        height: 100vh;
        height: 100dvh;
        position: fixed;
        width: 100%;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font-family: inherit;
        color: inherit;
      }

      a {
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--vermilion);
        outline-offset: 2px;
      }

      /* ------------------------------- Container -------------------------------- */
      .container {
        display: flex;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .container::-webkit-scrollbar {
        display: none;
      }

      .day-card {
        min-width: 100vw;
        height: 100vh;
        height: 100dvh;
        scroll-snap-align: start;
        display: flex;
        flex-direction: column;
        background: var(--paper);
      }

      /* ------------------------------- Day header ------------------------------- */
      .day-header {
        background: var(--paper-deep);
        padding: var(--space-base) var(--space-lg);
        padding-top: calc(var(--space-base) + env(safe-area-inset-top));
        padding-left: calc(var(--space-lg) + env(safe-area-inset-left));
        padding-right: calc(var(--space-lg) + env(safe-area-inset-right));
        border-bottom: 1px solid var(--paper-edge);
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-md);
      }

      .day-title {
        font-family: var(--font-serif);
        font-size: clamp(18px, 5.2vw, 22px);
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.01em;
        color: var(--ink);
        flex: 1;
        min-width: 0;
        word-break: break-word;
      }

      .day-chips {
        display: flex;
        gap: var(--space-sm);
        flex-shrink: 0;
      }

      .chip-info {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: var(--space-sm) 14px;
        min-height: 44px;
        background: var(--paper-soft);
        color: var(--ink-soft);
        border: none;
        border-radius: var(--radius-pill);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background var(--duration-fast);
      }

      .chip-info:hover,
      .chip-info:focus-visible {
        background: var(--paper-edge);
        outline: none;
      }
      .chip-info:focus-visible {
        outline: 2px solid var(--vermilion);
        outline-offset: 2px;
      }

      .chip-info:active {
        background: var(--paper-edge);
      }

      .chip-info svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      /* ------------------------------- Day content ------------------------------ */
      .day-content {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-md) var(--space-lg) 120px;
        padding-left: calc(var(--space-lg) + env(safe-area-inset-left));
        padding-right: calc(var(--space-lg) + env(safe-area-inset-right));
        padding-bottom: calc(120px + env(safe-area-inset-bottom));
        -webkit-overflow-scrolling: touch;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }

      /* ------------------------------- Item row --------------------------------- */
      .item {
        display: grid;
        grid-template-columns: 24px 56px minmax(0, 1fr) 16px;
        column-gap: 10px;
        align-items: center;
        padding: var(--space-md);
        border-radius: var(--radius-md);
        min-height: 56px;
        background: transparent;
        transition: background var(--duration-fast);
        min-width: 0;
        flex-shrink: 0;
      }

      .item.no-time {
        grid-template-columns: 24px minmax(0, 1fr) 16px;
      }

      .item.clickable {
        cursor: pointer;
      }

      .item.clickable:hover {
        background: var(--paper-soft);
      }
      .item.clickable:active {
        background: var(--paper-edge);
      }

      .item.current {
        background: var(--vermilion-tint);
      }
      .item.current .item-icon,
      .item.current .item-chevron {
        color: var(--vermilion-deep);
      }

      .item-icon {
        width: 24px;
        height: 24px;
        color: var(--ink-soft);
        flex-shrink: 0;
      }

      .item-time {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.3;
        color: var(--vermilion-deep);
        font-variant-numeric: tabular-nums;
      }

      .item.no-time .item-time {
        display: none;
      }

      .item-content {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .item-title {
        font-size: 16px;
        font-weight: 400;
        line-height: 1.5;
        color: var(--ink);
        overflow-wrap: anywhere;
        word-break: break-word;
        min-width: 0;
      }

      .item-subtitle {
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink-faint);
        overflow-wrap: anywhere;
        word-break: break-word;
        min-width: 0;
      }

      .item-mapcode {
        align-self: flex-start;
        margin-top: 4px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-soft);
        background: var(--paper-deep);
        padding: 2px 8px;
        border-radius: var(--radius-sm);
        font-variant-numeric: tabular-nums;
      }

      .item-chevron {
        width: 16px;
        height: 16px;
        color: var(--ink-ghost);
        flex-shrink: 0;
      }

      .item:not(.clickable) .item-chevron {
        visibility: hidden;
      }

      /* ------------------------------ Day indicator ----------------------------- */
      .day-indicator {
        position: fixed;
        left: 50%;
        bottom: calc(var(--space-base) + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-md);
        background: oklch(97% 0.005 70 / 0.92);
        border: 1px solid var(--paper-edge);
        border-radius: var(--radius-pill);
        z-index: 50;
        backdrop-filter: saturate(1.1);
      }

      .day-dot {
        position: relative;
        width: 8px;
        height: 8px;
        padding: 0;
        background: var(--ink-ghost);
        border: none;
        border-radius: var(--radius-pill);
        cursor: pointer;
        transition:
          background var(--duration-fast),
          width var(--duration-fast);
      }

      .day-dot::after {
        content: '';
        position: absolute;
        inset: -12px;
      }

      .day-dot:hover,
      .day-dot:focus-visible {
        background: var(--ink-soft);
        outline: none;
      }
      .day-dot:focus-visible {
        outline: 2px solid var(--vermilion);
        outline-offset: 4px;
      }

      .day-dot.active {
        background: var(--vermilion);
        width: 24px;
      }

      /* ------------------------------- Bottom sheet ----------------------------- */
      .bottom-sheet-overlay {
        position: fixed;
        inset: 0;
        background: var(--overlay);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--duration-base);
        z-index: 999;
      }
      .bottom-sheet-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .bottom-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--paper);
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        transform: translateY(100%);
        transition: transform var(--duration-base) var(--ease-standard);
        z-index: 1000;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
      }
      .bottom-sheet.active {
        transform: translateY(0);
      }

      .sheet-handle {
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 32px;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .sheet-handle:active {
        cursor: grabbing;
      }

      .grab-handle {
        width: 36px;
        height: 4px;
        background: var(--paper-edge);
        border-radius: var(--radius-pill);
      }

      .bottom-sheet-content {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-md) var(--space-lg) var(--space-xl);
        padding-bottom: calc(var(--space-xl) + env(safe-area-inset-bottom));
        padding-left: calc(var(--space-lg) + env(safe-area-inset-left));
        padding-right: calc(var(--space-lg) + env(safe-area-inset-right));
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      .detail-title {
        font-size: 22px;
        font-weight: 600;
        line-height: 1.2;
        color: var(--ink);
        margin-bottom: var(--space-lg);
      }

      .detail-section {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
        margin-bottom: var(--space-xl);
      }
      .detail-section:last-child {
        margin-bottom: 0;
      }

      .detail-label {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-soft);
      }

      .detail-link {
        display: inline-flex;
        align-items: center;
        gap: var(--space-sm);
        align-self: flex-start;
        padding: var(--space-md) var(--space-base);
        min-height: 44px;
        background: var(--vermilion-tint);
        color: var(--vermilion-deep);
        text-decoration: none;
        border-radius: var(--radius-md);
        font-size: 16px;
        font-weight: 500;
        transition:
          background var(--duration-fast),
          color var(--duration-fast);
      }
      .detail-link:hover,
      .detail-link:focus-visible {
        background: var(--vermilion);
        color: var(--paper);
        outline: none;
      }
      .detail-link:focus-visible {
        outline: 2px solid var(--vermilion-deep);
        outline-offset: 2px;
      }
      .detail-link:active {
        background: var(--vermilion-deep);
        color: var(--paper);
      }

      .detail-link svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      .detail-notes {
        font-size: 16px;
        line-height: 1.6;
        color: var(--ink-soft);
        background: var(--paper-deep);
        padding: var(--space-base);
        border-radius: var(--radius-md);
      }
      .detail-notes strong {
        color: var(--ink);
        font-weight: 600;
      }
      .detail-notes a {
        color: var(--vermilion-deep);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }
      .detail-notes a:hover {
        color: var(--vermilion);
      }
      .detail-notes ul {
        list-style: disc;
        padding-left: var(--space-lg);
      }
      .detail-notes img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: var(--space-sm) auto;
        border-radius: var(--radius-sm);
      }

      .menu-images {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
      }

      .menu-image {
        width: 100%;
        border-radius: var(--radius-md);
        overflow: hidden;
        background: var(--paper-deep);
      }
      .menu-image img {
        width: 100%;
        height: auto;
        display: block;
      }

      .error-state {
        padding: var(--space-xl);
        color: var(--vermilion-deep);
        font-size: 16px;
        line-height: 1.5;
      }

      /* --------------------------- Reduced motion ------------------------------- */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
        .bottom-sheet {
          transition: none;
        }
        .container {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>

      <div class="bottom-sheet-content" id="sheetContent"></div>

        externalLink: `
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        `,
      };

      function svg(name) {
        const path = ICON_PATHS[name] || ICON_PATHS.location;
        return `<svg ${ICON_ATTRS}>${path}</svg>`;
      }

      // ---------------------------- State + load --------------------------------
      const ITINERARY_SOURCE = 'itinerary.json';

      const container = document.getElementById('container');
      const dayIndicator = document.getElementById('dayIndicator');
      const overlay = document.getElementById('overlay');
      const bottomSheet = document.getElementById('bottomSheet');
      const sheetContent = document.getElementById('sheetContent');

      let itineraryData = null;
      let dayCards = [];
      let dayDots = [];
      let activeDayIndex = 0;

      async function loadItinerary() {
        try {
          const response = await fetch(ITINERARY_SOURCE);
          itineraryData = await response.json();
          renderItinerary();
          renderDayIndicator();
          observeActiveDay();
        } catch (error) {
          console.error('Error loading itinerary:', error);
          container.innerHTML = `<div class="error-state">無法載入行程資料，請確認 ${ITINERARY_SOURCE} 檔案存在</div>`;
        }
      }

      // ---------------------------- Render --------------------------------------
      function renderItinerary() {
        container.innerHTML = '';
        dayCards = [];

        itineraryData.days.forEach((day, dayIdx) => {
          const dayCard = document.createElement('section');
          dayCard.className = 'day-card';
          dayCard.dataset.dayIndex = String(dayIdx);

          const header = document.createElement('header');
          header.className = 'day-header';
          header.innerHTML = `
            <h1 class="day-title">DAY ${day.dayNumber} │ ${escapeHtml(day.date)}</h1>
            <div class="day-chips">
              <button class="chip-info" type="button" data-info="general">
                ${svg('info')}
                <span>通用</span>
              </button>
              <button class="chip-info" type="button" data-info="train">
                ${svg('train')}
                <span>地鐵</span>
              </button>
            </div>
          `;
          header
            .querySelector('[data-info="general"]')
            .addEventListener('click', openGeneralInfo);
          header
            .querySelector('[data-info="train"]')
            .addEventListener('click', openTrainInfo);

          const list = document.createElement('ul');
          list.className = 'day-content';

          day.items.forEach((item) => {
            list.appendChild(renderItem(item));
          });

          dayCard.appendChild(header);
          dayCard.appendChild(list);
          container.appendChild(dayCard);
          dayCards.push(dayCard);
        });
      }

      function renderItem(item) {
        const li = document.createElement('li');
        li.className = 'item';
        if (!item.time) li.classList.add('no-time');
        if (item.hasDetails) {
          li.classList.add('clickable');
          li.setAttribute('role', 'button');
          li.setAttribute('tabindex', '0');
          li.addEventListener('click', () => openBottomSheet(item));
          li.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openBottomSheet(item);
            }
          });
        }

        const iconWrap = document.createElement('div');
        iconWrap.className = 'item-icon';
        iconWrap.innerHTML = svg(item.icon);

        const time = document.createElement('div');
        time.className = 'item-time';
        time.textContent = item.time || '';

        const content = document.createElement('div');
        content.className = 'item-content';

        const titleEl = document.createElement('p');
        titleEl.className = 'item-title';
        titleEl.textContent = item.title;
        content.appendChild(titleEl);

        if (item.subtitle) {
          const subEl = document.createElement('p');
          subEl.className = 'item-subtitle';
          subEl.textContent = item.subtitle;
          content.appendChild(subEl);
        }

        if (item.mapCode) {
          const codeEl = document.createElement('span');
          codeEl.className = 'item-mapcode';
          codeEl.textContent = item.mapCode;
          content.appendChild(codeEl);
        }

        const chevron = document.createElement('div');
        chevron.className = 'item-chevron';
        chevron.innerHTML = svg('chevron');

        li.appendChild(iconWrap);
        if (item.time) li.appendChild(time);
        li.appendChild(content);
        li.appendChild(chevron);
        return li;
      }

      // ---------------------------- Day indicator -------------------------------
      function renderDayIndicator() {
        dayIndicator.innerHTML = '';
        dayDots = [];
        itineraryData.days.forEach((day, idx) => {
          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'day-dot';
          dot.setAttribute('aria-label', `DAY ${day.dayNumber} ${day.date}`);
          if (idx === 0) {
            dot.classList.add('active');
            dot.setAttribute('aria-current', 'true');
          }
          dot.addEventListener('click', () => scrollToDay(idx));
          dayIndicator.appendChild(dot);
          dayDots.push(dot);
        });
      }

      function scrollToDay(idx) {
        const card = dayCards[idx];
        if (!card) return;
        const prefersReduce = window.matchMedia(
          '(prefers-reduced-motion: reduce)',
        ).matches;
        container.scrollTo({
          left: card.offsetLeft,
          behavior: prefersReduce ? 'auto' : 'smooth',
        });
      }

      function setActiveDay(idx) {
        if (idx === activeDayIndex) return;
        activeDayIndex = idx;
        dayDots.forEach((dot, i) => {
          if (i === idx) {
            dot.classList.add('active');
            dot.setAttribute('aria-current', 'true');
          } else {
            dot.classList.remove('active');
            dot.removeAttribute('aria-current');
          }
        });
      }

      function observeActiveDay() {
        if (!('IntersectionObserver' in window)) return;
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                const idx = Number(entry.target.dataset.dayIndex);
                if (!Number.isNaN(idx)) setActiveDay(idx);
              }
            });
          },
          {
            root: container,
            threshold: [0.5, 0.75],
          },
        );
        dayCards.forEach((card) => observer.observe(card));
      }

      // ---------------------------- Bottom sheet --------------------------------
      function openBottomSheet(item) {
        sheetContent.innerHTML = renderDetail(item);
        sheetContent.scrollTop = 0;
        overlay.classList.add('active');
        bottomSheet.classList.add('active');
      }

      function openGeneralInfo() {
        const tpl = document.getElementById('generalInfoTemplate');
        sheetContent.innerHTML = tpl.innerHTML;
        sheetContent.scrollTop = 0;
        overlay.classList.add('active');
        bottomSheet.classList.add('active');
      }

      function openTrainInfo() {
        const tpl = document.getElementById('trainInfoTemplate');
        sheetContent.innerHTML = tpl.innerHTML;
        sheetContent.scrollTop = 0;
        overlay.classList.add('active');
        bottomSheet.classList.add('active');
      }

      function closeBottomSheet() {
        overlay.classList.remove('active');
        bottomSheet.classList.remove('active');
      }

      function renderDetail(item) {
        const details = item.details || {};
        let html = `<div class="detail-title" id="sheetTitle">${escapeHtml(item.title)}</div>`;

        if (details.googleMapUrl) {
          html += `
            <div class="detail-section">
              <h3 class="detail-label">地圖位置</h3>
              <a href="${escapeAttr(details.googleMapUrl)}" target="_blank" rel="noopener noreferrer" class="detail-link">
                ${svg('mapPin')}
                <span>開啟 Google Maps</span>
              </a>
            </div>
          `;
        }

        if (details.notes) {
          html += `
            <div class="detail-section">
              <h3 class="detail-label">備註</h3>
              <div class="detail-notes">${details.notes}</div>
            </div>
          `;
        }

        if (details.menuImages && details.menuImages.length > 0) {
          html += `
            <div class="detail-section">
              <h3 class="detail-label">菜單</h3>
              <div class="menu-images">
                ${details.menuImages
                  .map(
                    (src) => `
                  <div class="menu-image">
                    <img src="${escapeAttr(src)}" alt="菜單圖片" loading="lazy">
                  </div>
                `,
                  )
                  .join('')}
              </div>
            </div>
          `;
        }

        if (details.website) {
          html += `
            <div class="detail-section">
              <h3 class="detail-label">簡介</h3>
              <a href="${escapeAttr(details.website)}" target="_blank" rel="noopener noreferrer" class="detail-link">
                ${svg('externalLink')}
                <span>查看網站</span>
              </a>
            </div>
          `;
        }

        return html;
      }

      // ---------------------------- Utils ---------------------------------------
      function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function escapeAttr(str) {
        if (str == null) return '';
        return String(str).replace(/"/g, '&quot;').replace(/</g, '&lt;');
      }

      // ---------------------------- Drag to close ------------------------------
      const sheetHandle = document.getElementById('sheetHandle');
      const CLOSE_THRESHOLD_RATIO = 0.25;

      let dragStartY = null;
      let dragActivePointerId = null;
      let isDraggingSheet = false;

      function pointY(event) {
        if (event.clientY !== undefined && event.clientY !== null) {
          return event.clientY;
        }
        if (event.touches && event.touches[0]) {
          return event.touches[0].clientY;
        }
        return 0;
      }

      function onHandlePointerDown(event) {
        if (!bottomSheet.classList.contains('active')) return;
        if (event.isPrimary === false) return;
        dragStartY = pointY(event);
        dragActivePointerId = event.pointerId ?? null;
        isDraggingSheet = false;
        if (sheetHandle.setPointerCapture && dragActivePointerId !== null) {
          sheetHandle.setPointerCapture(dragActivePointerId);
        }
      }

      function onHandlePointerMove(event) {
        if (dragStartY === null) return;
        if (
          dragActivePointerId !== null &&
          event.pointerId !== undefined &&
          event.pointerId !== dragActivePointerId
        ) {
          return;
        }

        const deltaY = pointY(event) - dragStartY;

        if (deltaY <= 0) {
          bottomSheet.style.transition = 'none';
          bottomSheet.style.transform = '';
          overlay.style.opacity = '';
          isDraggingSheet = false;
          return;
        }

        isDraggingSheet = true;
        bottomSheet.style.transition = 'none';
        bottomSheet.style.transform = `translateY(${deltaY}px)`;

        const ratio = Math.min(deltaY / bottomSheet.offsetHeight, 1);
        overlay.style.opacity = String(Math.max(0, 1 - ratio * 0.85));
      }

      function onHandlePointerUp(event) {
        if (dragStartY === null) return;
        if (
          dragActivePointerId !== null &&
          event.pointerId !== undefined &&
          event.pointerId !== dragActivePointerId
        ) {
          return;
        }

        const deltaY = pointY(event) - dragStartY;
        const shouldClose =
          isDraggingSheet &&
          deltaY > bottomSheet.offsetHeight * CLOSE_THRESHOLD_RATIO;

        bottomSheet.style.transition = '';
        bottomSheet.style.transform = '';
        overlay.style.opacity = '';

        if (sheetHandle.releasePointerCapture && dragActivePointerId !== null) {
          try {
            sheetHandle.releasePointerCapture(dragActivePointerId);
          } catch {
            /* pointer already released */
          }
        }

        dragStartY = null;
        dragActivePointerId = null;
        isDraggingSheet = false;

        if (shouldClose) closeBottomSheet();
      }

      sheetHandle.addEventListener('pointerdown', onHandlePointerDown);
      sheetHandle.addEventListener('pointermove', onHandlePointerMove);
      sheetHandle.addEventListener('pointerup', onHandlePointerUp);
      sheetHandle.addEventListener('pointercancel', onHandlePointerUp);

      overlay.addEventListener('click', closeBottomSheet);
      document.addEventListener('keydown', (event) => {
        if (
          event.key === 'Escape' &&
          bottomSheet.classList.contains('active')
        ) {
          closeBottomSheet();
        }
      });

      loadItinerary();
    </script>
  </body>
</html>
